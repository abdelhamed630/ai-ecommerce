# Reverse proxy in front of the FastAPI container.
# TLS is NOT handled here: terminate HTTPS at your load balancer / ingress /
# cloud proxy (or add a `listen 443 ssl` server with your own certificates) and
# forward to this port. X-Forwarded-Proto is passed through when a TLS-terminating
# proxy sits in front. Verified locally by the maintainer: the nginx container runs healthy
# with this file and proxies the API (including chatbot streaming).

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 30s;
    # Avatar uploads are limited to 2 MB by the application; a little headroom
    # for multipart overhead.
    client_max_body_size 3m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Honour X-Forwarded-Proto from an upstream TLS terminator, else use $scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # Per-IP limit for all LLM-backed chat traffic (/chatbot/...). It is a coarse, outer
    # shield: the precise limit is the application's per-USER limit
    # (CHATBOT_RATE_LIMIT_PER_MINUTE, default 20/min). This one is deliberately HIGHER
    # (60 r/min + burst 20) so a normal user is never stopped here first, even when
    # several users share one IP (office / NAT). Keep it above that setting.
    limit_req_zone $binary_remote_addr zone=chatbot:10m rate=60r/m;
    limit_req_status 429;

    upstream api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Chatbot (POST /chatbot/chat and /chatbot/chat/stream). Everything else is
        # unaffected: it keeps using `location /` below.
        location /chatbot/ {
            limit_req zone=chatbot burst=20 nodelay;
            # Chat bodies are small (message <= 2000 chars + <= 50 history turns).
            client_max_body_size 256k;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # A location that sets proxy_set_header does not inherit the server-level ones,
            # so everything is repeated. Authorization is forwarded explicitly (nginx also
            # forwards it by default); the request body is proxied unchanged.
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            # Server-Sent Events (/chatbot/chat/stream): do not buffer the response.
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            # Synchronous endpoints such as on-demand segmentation can be slow.
            proxy_read_timeout 60s;
        }
    }
}
