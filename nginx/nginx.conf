# Reverse proxy in front of the FastAPI container.
# TLS is NOT handled here: terminate HTTPS at your load balancer / ingress /
# cloud proxy (or add a `listen 443 ssl` server with your own certificates) and
# forward to this port. X-Forwarded-Proto is passed through when a TLS-terminating
# proxy sits in front. NOT VERIFIED: never run by its author (`nginx -t` not executed).

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 30s;
    # Avatar uploads are limited to 2 MB by the application; a little headroom
    # for multipart overhead.
    client_max_body_size 3m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Honour X-Forwarded-Proto from an upstream TLS terminator, else use $scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            # Synchronous endpoints such as on-demand segmentation can be slow.
            proxy_read_timeout 60s;
        }
    }
}
