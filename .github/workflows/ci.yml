# NOT VERIFIED: this workflow has never been executed (it was written without
# access to GitHub Actions). Expect to fix small issues on its first run.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Dependencies (numpy/pandas/scikit-learn) require Python >= 3.11.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password_not_a_secret
          POSTGRES_DB: ai_ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ai_ecommerce_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # Throw-away CI credentials for the service containers above; no real secrets.
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci_password_not_a_secret@localhost:5432/ai_ecommerce_test
      ALEMBIC_TEST_DATABASE_URL: postgresql+psycopg://ci:ci_password_not_a_secret@localhost:5432/ai_ecommerce_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Full test suite (default-DB tests run on PostgreSQL via TEST_DATABASE_URL)
        run: python -m pytest -q

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password_not_a_secret
          POSTGRES_DB: ai_ecommerce_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ai_ecommerce_migrate"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci_password_not_a_secret@localhost:5432/ai_ecommerce_migrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Fresh PostgreSQL -> alembic upgrade head
        run: alembic upgrade head
      - name: Downgrade to base and upgrade again (reversibility)
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Models and migrations agree (no pending autogenerate changes)
        run: alembic check
