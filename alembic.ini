# Alembic configuration. The database URL is NOT stored here: alembic/env.py
# reads settings.DATABASE_URL (the DATABASE_URL environment variable / .env).
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Uses the default file_template; migrations are numbered by hand (0001, 0002, ...).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
